name: Clean and Sync All Branches to Alt Account

on:
  push:
    branches:
      - '**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 关键配置 1：防止 actions/checkout 注入默认的 github-actions[bot] 鉴权头
          persist-credentials: false

      - name: Install git-filter-repo
        run: |
          pip install git-filter-repo

      - name: Rewrite git history & push all branches
        env:
          ALT_TOKEN: ${{ secrets.ALT_GITHUB_TOKEN }}
          ALT_USERNAME: ${{ secrets.ALT_USERNAME }}
          ALT_REPO: ${{ secrets.ALT_REPO }}
          ALT_EMAIL: ${{ secrets.ALT_EMAIL }}
        run: |
          # 关键配置 2：彻底清除本地 git 配置中可能残留的 extraheader
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # 1. 追踪所有远程分支
          for branch in $(git branch -r | grep -v '\->' | grep -v 'origin/HEAD'); do
            git branch --track ${branch#origin/} $branch 2>/dev/null || true
          done

          # 2. 清理目录并重写提交历史
          git-filter-repo \
            --path .github --invert-paths \
            --name-callback "return b'''${ALT_USERNAME}'''" \
            --email-callback "return b'''${ALT_EMAIL}'''" \
            --force

          # 3. 使用小号凭据配置远程地址
          git remote add alt "https://${ALT_USERNAME}:${ALT_TOKEN}@github.com/${ALT_USERNAME}/${ALT_REPO}.git"

          # 4. 推送所有分支
          git push alt --all --force
