name: CI

on:
  push:
    branches:
      - main
      - master
      - perfrom
      - 'opt/**'
      - 'hardening/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Unit, lint, typecheck, CSS gates
        run: npm run ci

      - name: Dependency closure (FIND-15/16)
        run: npm run test:deps

      - name: Full release gate (unit + browser + evidence)
        env:
          # Prefer Chromium on GHA; local default remains msedge when present.
          AUDIT_CHANNEL: chromium
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: npm run test:release

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazyload-evidence
          path: |
            .tmp/**/playwright/**
            .tmp/**/evidence/**
            .tmp/lazyload-repair/**
          if-no-files-found: ignore
          retention-days: 14
